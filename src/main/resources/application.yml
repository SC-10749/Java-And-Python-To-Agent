  # MySQL 业务数据库
  datasource:
    url: jdbc:mysql://124.223.92.65:3316/ad_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
